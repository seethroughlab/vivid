<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivid</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Drag region for window movement (title bar area) -->
      <div class="titlebar" data-tauri-drag-region>
        <span class="title">Vivid</span>
        <span class="status" id="status">WebGPU Active</span>
      </div>

      <!-- Main content area with panels -->
      <div class="main-content">
        <!-- Left panel: Inspector -->
        <div class="panel panel-left" id="inspector-panel">
          <div class="panel-header">
            <span>Inspector</span>
            <button class="panel-toggle" id="toggle-inspector">−</button>
          </div>
          <div class="panel-content">
            <div class="param-group">
              <label>Scale</label>
              <input type="range" min="0.1" max="10" step="0.1" value="4" id="param-scale" />
              <span class="param-value" id="value-scale">4.0</span>
            </div>
            <div class="param-group">
              <label>Speed</label>
              <input type="range" min="0" max="2" step="0.05" value="0.3" id="param-speed" />
              <span class="param-value" id="value-speed">0.3</span>
            </div>
            <div class="param-group">
              <label>Octaves</label>
              <input type="range" min="1" max="8" step="1" value="4" id="param-octaves" />
              <span class="param-value" id="value-octaves">4</span>
            </div>
          </div>
        </div>

        <!-- Preview area (transparent - shows wgpu behind) -->
        <div class="preview-area" id="preview-area">
          <!-- This is transparent - wgpu renders behind -->
        </div>

        <!-- Right panel: Terminal -->
        <div class="panel panel-right" id="terminal-panel">
          <div class="panel-header">
            <span>Claude Code</span>
            <button class="panel-toggle" id="toggle-terminal">−</button>
          </div>
          <div class="panel-content">
            <div id="terminal"></div>
          </div>
        </div>
      </div>

      <!-- Bottom panel: Code Editor -->
      <div class="panel panel-bottom" id="editor-panel">
        <div class="panel-header">
          <span class="editor-filename" id="editor-filename">No file open</span>
          <div class="editor-actions">
            <button class="editor-btn" id="open-file" title="Open File">Open</button>
            <button class="editor-btn" id="save-file" title="Save (Cmd+S)">Save</button>
            <button class="panel-toggle" id="toggle-editor">−</button>
          </div>
        </div>
        <div class="panel-content">
          <div id="editor"></div>
        </div>
      </div>

      <!-- Bottom status bar -->
      <div class="statusbar">
        <span class="editor-status" id="editor-status"></span>
        <span class="fps" id="fps">60 FPS</span>
        <span class="resolution" id="resolution">1280 × 800</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
