[package]
name = "vivid-tauri"
version = "0.1.0"
description = "Vivid IDE - WebGPU creative coding with transparent webview overlay"
authors = ["Vivid"]
edition = "2021"

[lib]
name = "vivid_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "22"
pollster = "0.4"
tokio = { version = "1", features = ["time", "rt", "sync", "io-util"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
portable-pty = "0.8"
parking_lot = "0.12"

# Vivid embedding
vivid = { path = "../crates/vivid" }

# egui for native UI (pinned to 0.29 for egui_node_graph2 compatibility)
egui = "0.29"
egui-wgpu = "0.29"
egui_node_graph2 = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
