<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid WebSocket Control</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            margin-bottom: 30px;
            font-weight: 300;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-dot.connected { background: #4caf50; }
        .status-dot.disconnected { background: #f44336; }
        .control-group {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .value-display {
            min-width: 60px;
            text-align: right;
            font-family: monospace;
            font-size: 16px;
            color: #fff;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 26px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle input:checked + .toggle-slider {
            background: #6c5ce7;
        }
        .toggle input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        .toggle-label {
            font-size: 16px;
        }
        #time-display {
            font-family: monospace;
            color: #6c5ce7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vivid Control</h1>

        <div class="status-bar">
            <span>
                <span class="status-dot disconnected" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </span>
            <span id="time-display">0.00s</span>
        </div>

        <div class="control-group">
            <label>Hue Shift</label>
            <div class="slider-row">
                <input type="range" id="hue" min="0" max="1" step="0.01" value="0">
                <span class="value-display" id="hue-value">0.00</span>
            </div>
        </div>

        <div class="control-group">
            <label>Noise Scale</label>
            <div class="slider-row">
                <input type="range" id="scale" min="1" max="10" step="0.1" value="4">
                <span class="value-display" id="scale-value">4.0</span>
            </div>
        </div>

        <div class="control-group">
            <label>Animation Speed</label>
            <div class="slider-row">
                <input type="range" id="speed" min="0" max="2" step="0.05" value="0.5">
                <span class="value-display" id="speed-value">0.50</span>
            </div>
        </div>

        <div class="control-group">
            <label>Rotation</label>
            <div class="slider-row">
                <input type="range" id="rotation" min="0" max="6.28" step="0.01" value="0">
                <span class="value-display" id="rotation-value">0.00</span>
            </div>
        </div>

        <div class="control-group">
            <div class="toggle-group">
                <label class="toggle">
                    <input type="checkbox" id="animate" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Animation Enabled</span>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimer = null;

        function connect() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('status-dot').className = 'status-dot connected';
                document.getElementById('status-text').textContent = 'Connected';
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onclose = () => {
                document.getElementById('status-dot').className = 'status-dot disconnected';
                document.getElementById('status-text').textContent = 'Disconnected';
                // Reconnect after 2 seconds
                reconnectTimer = setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'state') {
                        // Update time display
                        document.getElementById('time-display').textContent =
                            data.time.toFixed(2) + 's';
                    }
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Send update to server
        const sendUpdate = debounce((param, value) => {
            fetch('/api/update', {
                method: 'POST',
                body: `${param}=${value}`
            }).catch(err => console.error('Update failed:', err));
        }, 50);

        // Set up slider handlers
        function setupSlider(id) {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + '-value');

            slider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                display.textContent = value.toFixed(2);
                sendUpdate(id, value);
            });
        }

        setupSlider('hue');
        setupSlider('scale');
        setupSlider('speed');
        setupSlider('rotation');

        // Animate toggle
        document.getElementById('animate').addEventListener('change', (e) => {
            sendUpdate('animate', e.target.checked);
        });

        // Initial connection
        connect();

        // Fetch initial state
        fetch('/api/state')
            .then(res => res.json())
            .then(data => {
                document.getElementById('hue').value = data.hue;
                document.getElementById('hue-value').textContent = data.hue.toFixed(2);
                document.getElementById('scale').value = data.scale;
                document.getElementById('scale-value').textContent = data.scale.toFixed(1);
                document.getElementById('speed').value = data.speed;
                document.getElementById('speed-value').textContent = data.speed.toFixed(2);
                document.getElementById('rotation').value = data.rotation;
                document.getElementById('rotation-value').textContent = data.rotation.toFixed(2);
                document.getElementById('animate').checked = data.animate;
            })
            .catch(err => console.error('Failed to fetch state:', err));
    </script>
</body>
</html>
