[project]
name = "music-eval-service"
version = "0.1.0"
description = "Vivid music evaluation sidecar — LALM inference service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "httpx>=0.27",
    "google-genai>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
