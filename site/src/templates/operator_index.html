<div class="operator-filter-root">
  <a class="back-link" href="$home_href">&larr; Back to Vivid</a>
  <div class="page-header">
    <h1 class="page-title">Operator Reference</h1>
    <p class="subtitle">All built-in core operators across GPU, Audio, and Control domains.</p>
  </div>
  <section id="operator-filter-panel" class="filter-panel" aria-label="Operator filters" hidden>
    <div class="filter-row">
      <div class="filter-field">
        <label for="operator-search">Search operators</label>
        <input id="operator-search" class="filter-input" type="search" placeholder="Search by name or summary" autocomplete="off">
      </div>
      <div class="filter-field filter-select-field">
        <label for="operator-domain">Domain</label>
        <select id="operator-domain" class="filter-select">
          <option value="">All</option>
          <option value="gpu">GPU</option>
          <option value="audio">Audio</option>
          <option value="control">Control</option>
        </select>
      </div>
      <button id="operator-clear" class="filter-clear" type="button">Clear filters</button>
    </div>
    <p id="operator-results" class="filter-results" aria-live="polite">Showing all operators.</p>
    <p id="operator-empty" class="empty-state filter-empty" hidden>No operators match the current filters.</p>
  </section>
  $domain_sections
</div>
