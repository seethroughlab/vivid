<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Vivid">
  <defs>
    <linearGradient id="vividSignal" x1="9" y1="12" x2="39" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ecdc4"/>
      <stop offset=".5" stop-color="#5ea0ff"/>
