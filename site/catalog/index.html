<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivid Package Catalog</title>
  <style>
    :root {
      --bg: #11161d;
      --card: #1a212b;
      --text: #e6edf3;
      --muted: #95a4b5;
      --accent: #4ecdc4;
      --border: #2c3644;
    }
    body {
      margin: 0;
      font-family: "JetBrains Mono", Menlo, Monaco, monospace;
      background: linear-gradient(180deg, #10151c 0%, #0d1117 100%);
      color: var(--text);
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
    }
    .back:hover {
      text-decoration: underline;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #121923;
      border-bottom: 1px solid var(--border);
    }
    .content {
      padding: 12px;
    }
    .name {
      margin: 0 0 6px;
      font-size: 16px;
      color: var(--accent);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .badge.stable {
      color: #4edc8f;
      border-color: #2a6c47;
      background: rgba(78, 220, 143, 0.12);
    }
    .badge.beta {
      color: #78b9ff;
      border-color: #2f5f90;
      background: rgba(120, 185, 255, 0.12);
    }
    .badge.experimental {
      color: #ffd166;
      border-color: #866a2d;
      background: rgba(255, 209, 102, 0.12);
    }
    .badge.broken {
      color: #ff8b8b;
      border-color: #8d3f3f;
      background: rgba(255, 139, 139, 0.12);
    }
    .badge.deprecated {
      color: #c0c8d0;
      border-color: #5b6572;
      background: rgba(192, 200, 208, 0.12);
    }
    .desc {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
    }
    .status-note {
      margin: 0 0 10px;
      color: #ffd166;
      font-size: 12px;
      line-height: 1.35;
    }
    .meta {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .actions a {
      display: inline-block;
      margin: 0 8px 8px 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
    }
    .actions a:hover {
      border-color: var(--accent);
    }
    code {
      display: block;
      margin-top: 4px;
      padding: 7px 8px;
      background: #0f141b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #d8f3f1;
      font-size: 11px;
      overflow-x: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; Back to Vivid</a>
    <h1>Vivid Package Catalog</h1>
    <p>Curated package index for the Vivid runtime.</p>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeStatus(value) {
      const allowed = new Set(["stable", "beta", "experimental", "broken", "deprecated"]);
      const s = String(value || "").toLowerCase();
      return allowed.has(s) ? s : "experimental";
    }

    async function run() {
      const grid = document.getElementById("grid");
      try {
        const res = await fetch("../packages.json", { cache: "no-store" });
        const data = await res.json();
        const pkgs = data.packages || [];
        grid.innerHTML = "";
        for (const p of pkgs) {
          const card = document.createElement("article");
          card.className = "card";
          const preview = p.preview_image_url || "";
          const description = p.description_short || p.description || "";
          const status = normalizeStatus(p.status);
          const statusNote = p.status_note ? `<p class="status-note">${escapeHtml(p.status_note)}</p>` : "";
          card.innerHTML = `
            ${preview ? `<img class="thumb" src="${escapeHtml(preview)}" alt="${escapeHtml(p.name)} preview">` : ""}
            <div class="content">
              <div class="header">
                <h2 class="name">${escapeHtml(p.name || "unknown")}</h2>
                <span class="badge ${status}">${status}</span>
              </div>
              <p class="desc">${escapeHtml(description)}</p>
              ${statusNote}
              <p class="meta">v${escapeHtml(p.version || "?")} · ${escapeHtml(p.category || "uncategorized")}</p>
              <div class="actions">
                ${p.repo_url ? `<a href="${escapeHtml(p.repo_url)}" target="_blank" rel="noopener">Repo</a>` : ""}
                ${p.homepage_url ? `<a href="${escapeHtml(p.homepage_url)}" target="_blank" rel="noopener">Homepage</a>` : ""}
              </div>
              <code>vivid packages install ${escapeHtml(p.install_url || p.url || "")}</code>
            </div>`;
          grid.appendChild(card);
        }
      } catch (err) {
        grid.innerHTML = "<p>Failed to load package catalog.</p>";
      }
    }
    run();
  </script>
</body>
</html>
