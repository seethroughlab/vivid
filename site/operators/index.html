<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivid Operator Reference</title>
  <style>
    :root {
      --bg: #11161d;
      --card: #1a212b;
      --text: #e6edf3;
      --muted: #95a4b5;
      --accent: #4ecdc4;
      --border: #2c3644;
    }
    body {
      margin: 0;
      font-family: "JetBrains Mono", Menlo, Monaco, monospace;
      background: linear-gradient(180deg, #10151c 0%, #0d1117 100%);
      color: var(--text);
      min-height: 100vh;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back {
      display: inline-block;
      margin-bottom: 18px;
      font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .subtitle { margin: 0 0 18px; color: var(--muted); font-size: 14px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab .count {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── Search ── */
    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .search::placeholder { color: var(--muted); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .op-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .op-card:hover { border-color: var(--accent); }
    .op-card.undocumented { opacity: 0.5; }
    .op-card .op-name {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .op-card .op-brief {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: middle;
      margin-left: 6px;
    }
    .badge.gpu {
      color: #c48dff;
      border: 1px solid #5c3d8f;
      background: rgba(196, 141, 255, 0.12);
    }
    .badge.audio {
      color: #ff9d5c;
      border: 1px solid #8f5a2d;
      background: rgba(255, 157, 92, 0.12);
    }
    .badge.control {
      color: #5cb8ff;
      border: 1px solid #2d5f8f;
      background: rgba(92, 184, 255, 0.12);
    }

    /* ── Detail view ── */
    .detail { display: none; }
    .detail.active { display: block; }
    .detail-header {
      margin-bottom: 24px;
    }
    .detail-header h2 {
      font-size: 24px;
      margin: 0 0 6px;
    }
    .detail-brief {
      font-size: 15px;
      color: var(--muted);
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .detail-body {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .detail-body p { margin: 0 0 12px; }
    .detail-body strong { color: var(--accent); }
    .detail-body code {
      padding: 1px 5px;
      background: rgba(78, 205, 196, 0.1);
      border-radius: 4px;
      font-size: 12px;
    }

    /* ── Tips ── */
    .tips {
      border: 1px solid #2a5c54;
      background: rgba(78, 205, 196, 0.06);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }
    .tips h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin: 0 0 10px;
    }
    .tips ul {
      margin: 0;
      padding: 0 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
    }
    .tips li { margin-bottom: 6px; }
    .tips li:last-child { margin-bottom: 0; }
    .tips code {
      padding: 1px 5px;
      background: rgba(78, 205, 196, 0.12);
      border-radius: 4px;
      font-size: 12px;
    }

    /* ── Tables ── */
    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 24px;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    td:first-child {
      color: var(--accent);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    .type-cell { color: var(--muted); white-space: nowrap; }
    .range-cell { color: var(--muted); white-space: nowrap; }

    /* ── Related ── */
    .related {
      margin-bottom: 24px;
    }
    .related-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .related-chip {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .related-chip:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    .source-link {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; Back to Vivid</a>

    <!-- Grid view -->
    <div id="grid-view">
      <h1>Operator Reference</h1>
      <p class="subtitle">All built-in operators across GPU, Audio, and Control domains.</p>
      <input class="search" type="text" id="search" placeholder="Search operators...">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </div>

    <!-- Detail view -->
    <div id="detail-view" class="detail">
      <a class="back" href="#" id="detail-back">&larr; All Operators</a>
      <div id="detail-content"></div>
    </div>
  </main>

  <!-- Minimal markdown renderer (inline, no dependency) -->
  <script>
    function renderMd(src) {
      if (!src) return "";
      return src
        .split(/\n{2,}/)
        .map(p => {
          p = p.replace(/\n/g, " ");
          p = p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          p = p.replace(/`([^`]+)`/g, "<code>$1</code>");
          return "<p>" + p + "</p>";
        })
        .join("");
    }

    function esc(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;");
    }

    let allOperators = [];
    let operatorIndex = {};
    let activeTab = "all";

    function renderGrid() {
      const q = document.getElementById("search").value.toLowerCase();
      const grid = document.getElementById("grid");
      const filtered = allOperators.filter(op => {
        if (activeTab !== "all" && op.domain !== activeTab) return false;
        if (q && !op.name.toLowerCase().includes(q) && !(op.brief || "").toLowerCase().includes(q)) return false;
        return true;
      });
      grid.innerHTML = filtered.map(op => `
        <div class="op-card${op.has_docs ? "" : " undocumented"}" data-id="${esc(op.id)}">
          <p class="op-name">${esc(op.name)}<span class="badge ${esc(op.domain)}">${esc(op.domain)}</span></p>
          <p class="op-brief">${esc(op.brief || "Documentation coming soon.")}</p>
        </div>
      `).join("");

      grid.querySelectorAll(".op-card").forEach(card => {
        card.addEventListener("click", () => showDetail(card.dataset.id));
      });
    }

    function renderTabs() {
      const domains = ["all", "gpu", "audio", "control"];
      const counts = { all: allOperators.length };
      allOperators.forEach(op => { counts[op.domain] = (counts[op.domain] || 0) + 1; });

      document.getElementById("tabs").innerHTML = domains.map(d =>
        `<button class="tab${d === activeTab ? " active" : ""}" data-domain="${d}">
          ${d === "all" ? "All" : d.charAt(0).toUpperCase() + d.slice(1)}
          <span class="count">${counts[d] || 0}</span>
        </button>`
      ).join("");

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.domain;
          renderTabs();
          renderGrid();
        });
      });
    }

    async function showDetail(id) {
      const op = operatorIndex[id];
      if (!op) return;

      // Update URL
      history.pushState({ op: id }, "", "?op=" + id);

      // Try to load detail JSON
      let detail = null;
      if (op.has_docs) {
        try {
          const res = await fetch(`./${id}.json`, { cache: "no-store" });
          if (res.ok) detail = await res.json();
        } catch (e) { /* fall through */ }
      }

      const d = detail || op;
      let html = `<div class="detail-header">
        <h2>${esc(d.name)} <span class="badge ${esc(d.domain)}">${esc(d.domain)}</span></h2>
        <p class="detail-brief">${esc(d.brief || "")}</p>
      </div>`;

      if (d.description) {
        html += `<div class="detail-body">${renderMd(d.description)}</div>`;
      }

      if (d.tips && d.tips.length) {
        html += `<div class="tips"><h3>Tips</h3><ul>
          ${d.tips.map(t => `<li>${renderMd(t).replace(/<\/?p>/g, "")}</li>`).join("")}
        </ul></div>`;
      }

      // Params table
      if (d.params && d.params.length) {
        html += `<p class="section-label">Parameters</p><table>
          <tr><th>Name</th><th>Type</th><th>Range</th><th>Default</th><th>Description</th></tr>
          ${d.params.map(p => {
            const range = (p.min != null && p.max != null) ? `${p.min} .. ${p.max}` : "";
            const type = p.type || "";
            const choices = p.choices ? p.choices.join(", ") : "";
            const desc = p.doc || "";
            const defaultVal = p.default != null ? p.default : "";
            return `<tr>
              <td>${esc(p.name)}</td>
              <td class="type-cell">${esc(choices || type)}</td>
              <td class="range-cell">${esc(range)}</td>
              <td class="range-cell">${esc(defaultVal)}</td>
              <td>${esc(desc)}</td>
            </tr>`;
          }).join("")}
        </table>`;
      }

      // Inputs table
      if (d.inputs && d.inputs.length) {
        html += `<p class="section-label">Inputs</p><table>
          <tr><th>Name</th><th>Type</th><th>Description</th></tr>
          ${d.inputs.map(p => `<tr>
            <td>${esc(p.name)}</td>
            <td class="type-cell">${esc(p.type || "")}</td>
            <td>${esc(p.doc || "")}</td>
          </tr>`).join("")}
        </table>`;
      }

      // Outputs table
      if (d.outputs && d.outputs.length) {
        html += `<p class="section-label">Outputs</p><table>
          <tr><th>Name</th><th>Type</th><th>Description</th></tr>
          ${d.outputs.map(p => `<tr>
            <td>${esc(p.name)}</td>
            <td class="type-cell">${esc(p.type || "")}</td>
            <td>${esc(p.doc || "")}</td>
          </tr>`).join("")}
        </table>`;
      }

      // Related operators
      if (d.related && d.related.length) {
        html += `<div class="related"><p class="section-label">Related Operators</p>
          <div class="related-chips">
            ${d.related.map(name => {
              const rel = allOperators.find(o => o.name === name);
              if (rel) return `<a class="related-chip" href="?op=${esc(rel.id)}">${esc(name)}</a>`;
              return `<span class="related-chip">${esc(name)}</span>`;
            }).join("")}
          </div>
        </div>`;
      }

      if (d.source_file) {
        html += `<p class="source-link">Source: <code>${esc(d.source_file)}</code></p>`;
      }

      document.getElementById("detail-content").innerHTML = html;
      document.getElementById("grid-view").style.display = "none";
      document.getElementById("detail-view").classList.add("active");

      // Wire up related operator links
      document.querySelectorAll(".related-chip[href]").forEach(chip => {
        chip.addEventListener("click", e => {
          e.preventDefault();
          const url = new URL(chip.href);
          showDetail(url.searchParams.get("op"));
        });
      });
    }

    function showGrid() {
      history.pushState({}, "", window.location.pathname);
      document.getElementById("grid-view").style.display = "block";
      document.getElementById("detail-view").classList.remove("active");
    }

    async function init() {
      try {
        const res = await fetch("./index.json", { cache: "no-store" });
        const data = await res.json();
        allOperators = (data.operators || []).sort((a, b) => a.name.localeCompare(b.name));
        operatorIndex = {};
        allOperators.forEach(op => { operatorIndex[op.id] = op; });

        renderTabs();
        renderGrid();

        document.getElementById("search").addEventListener("input", renderGrid);
        document.getElementById("detail-back").addEventListener("click", e => {
          e.preventDefault();
          showGrid();
        });

        // Handle URL state
        const params = new URLSearchParams(window.location.search);
        if (params.get("op")) {
          showDetail(params.get("op"));
        }

        window.addEventListener("popstate", () => {
          const p = new URLSearchParams(window.location.search);
          if (p.get("op")) showDetail(p.get("op"));
          else showGrid();
        });
      } catch (err) {
        document.getElementById("grid").innerHTML = "<p>Failed to load operator index.</p>";
      }
    }

    init();
  </script>
</body>
</html>
