<article class="showcase-card">
          <div class="showcase-media">
            $media
          </div>
          <div class="showcase-body">
            <span class="tag">$strand_label &middot; $mechanism</span>
            <h3 class="showcase-name">$title</h3>
            <p class="showcase-blurb">$blurb</p>
            <div class="showcase-foot">
              $attribution
              <a class="card-link" href="$source" rel="noopener" target="_blank">View the builder &rarr;</a>
            </div>
          </div>
        </article>
