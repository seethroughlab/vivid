<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Vivid Runtime Architecture</text>

  <!-- Main Thread Region -->
  <rect x="20" y="44" width="450" height="460" rx="8" fill="#f0f4ff" stroke="#93a3c0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="30" y="62" font-size="11" fill="#4b5e80" font-weight="600">MAIN THREAD (~60 Hz)</text>

  <!-- Audio Thread Region -->
  <rect x="490" y="44" width="220" height="460" rx="8" fill="#fff7ed" stroke="#c4956a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="500" y="62" font-size="11" fill="#9a6b3a" font-weight="600">AUDIO THREAD (~48 kHz)</text>

  <!-- RuntimeCore -->
  <rect x="40" y="76" width="410" height="56" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">RuntimeCore</text>
  <text x="245" y="118" text-anchor="middle" font-size="11" fill="#555">Orchestrator: build, tick, sync, reload, solo</text>

  <!-- OperatorRegistry -->
  <rect x="40" y="148" width="170" height="50" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="125" y="170" text-anchor="middle" font-weight="600" fill="#333">OperatorRegistry</text>
  <text x="125" y="186" text-anchor="middle" font-size="10" fill="#666">scan, load, hot-reload</text>

  <!-- GraphCompiler -->
  <rect x="228" y="148" width="170" height="50" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="313" y="170" text-anchor="middle" font-weight="600" fill="#333">GraphCompiler</text>
  <text x="313" y="186" text-anchor="middle" font-size="10" fill="#666">cadence, topo-sort, edges</text>

  <!-- CompiledGraph -->
  <rect x="100" y="216" width="240" height="50" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="238" text-anchor="middle" font-weight="600" fill="#1d4ed8">CompiledGraph</text>
  <text x="220" y="254" text-anchor="middle" font-size="10" fill="#3b6fcc">nodes, edges, frame_order, audio_order</text>

  <!-- FrameExecutor -->
  <rect x="40" y="290" width="190" height="60" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="314" text-anchor="middle" font-weight="bold" fill="#2563eb">FrameExecutor</text>
  <text x="135" y="332" text-anchor="middle" font-size="10" fill="#555">frame_order, GPU nodes</text>

  <!-- AudioFrameBridge -->
  <rect x="250" y="290" width="220" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="314" text-anchor="middle" font-weight="bold" fill="#b45309">AudioFrameBridge</text>
  <text x="360" y="332" text-anchor="middle" font-size="10" fill="#92400e">double-buffered snapshots</text>

  <!-- GPU Context -->
  <rect x="40" y="374" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="396" text-anchor="middle" font-weight="600" fill="#15803d">GpuContext</text>
  <text x="105" y="412" text-anchor="middle" font-size="10" fill="#166534">WebGPU device</text>

  <!-- HotReloader -->
  <rect x="188" y="374" width="130" height="50" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="253" y="396" text-anchor="middle" font-weight="600" fill="#333">HotReloader</text>
  <text x="253" y="412" text-anchor="middle" font-size="10" fill="#666">bg compile thread</text>

  <!-- Output Window -->
  <rect x="40" y="440" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="462" text-anchor="middle" font-weight="600" fill="#15803d">OutputWindow</text>
  <text x="105" y="478" text-anchor="middle" font-size="10" fill="#166534">GLFW + present</text>

  <!-- AudioExecutor -->
  <rect x="510" y="290" width="180" height="60" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" font-weight="bold" fill="#ea580c">AudioExecutor</text>
  <text x="600" y="332" text-anchor="middle" font-size="10" fill="#555">audio_order, 256-sample buf</text>

  <!-- miniaudio -->
  <rect x="510" y="374" width="180" height="50" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="396" text-anchor="middle" font-weight="600" fill="#333">miniaudio</text>
  <text x="600" y="412" text-anchor="middle" font-size="10" fill="#666">48 kHz, stereo playback</text>

  <!-- RecordingTap -->
  <rect x="510" y="440" width="180" height="50" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" font-weight="600" fill="#333">RecordingTap</text>
  <text x="600" y="478" text-anchor="middle" font-size="10" fill="#666">lock-free ring buffer</text>

  <!-- Arrows: RuntimeCore → children -->
  <line x1="125" y1="132" x2="125" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="313" y1="132" x2="313" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Registry/Compiler → CompiledGraph -->
  <line x1="155" y1="198" x2="185" y2="216" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="198" x2="255" y2="216" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CompiledGraph → FrameExecutor -->
  <line x1="175" y1="266" x2="145" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- CompiledGraph → AudioFrameBridge -->
  <line x1="275" y1="266" x2="330" y2="290" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AudioFrameBridge ↔ AudioExecutor (bidirectional) -->
  <line x1="470" y1="310" x2="510" y2="310" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="510" y1="330" x2="470" y2="330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="490" y="303" text-anchor="middle" font-size="9" fill="#ea580c">params</text>
  <text x="490" y="346" text-anchor="middle" font-size="9" fill="#2563eb">analysis</text>

  <!-- FrameExecutor → GPU -->
  <line x1="105" y1="350" x2="105" y2="374" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AudioExecutor → miniaudio -->
  <line x1="600" y1="350" x2="600" y2="374" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AudioExecutor → RecordingTap -->
  <line x1="600" y1="424" x2="600" y2="440" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HotReloader → Registry -->
  <path d="M 188,399 L 125,399 L 125,198" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
