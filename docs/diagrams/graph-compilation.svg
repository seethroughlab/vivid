<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Graph Compilation Pipeline</text>

  <!-- Step 1: Graph JSON -->
  <rect x="20" y="50" width="150" height="80" rx="6" fill="#f8f8f8" stroke="#666" stroke-width="1.5"/>
  <text x="95" y="74" text-anchor="middle" font-weight="bold" fill="#333">Graph (JSON)</text>
  <text x="95" y="92" text-anchor="middle" font-size="10" fill="#666">NodeDef[]</text>
  <text x="95" y="106" text-anchor="middle" font-size="10" fill="#666">ConnectionDef[]</text>
  <text x="95" y="120" text-anchor="middle" font-size="10" fill="#666">FilterDef[], Presets</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="90" x2="200" y2="90" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: GraphCompiler -->
  <rect x="208" y="44" width="160" height="92" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="288" y="68" text-anchor="middle" font-weight="bold" fill="#1d4ed8">GraphCompiler</text>
  <text x="288" y="86" text-anchor="middle" font-size="10" fill="#3b6fcc">1. Resolve descriptors</text>
  <text x="288" y="100" text-anchor="middle" font-size="10" fill="#3b6fcc">2. Assign cadences</text>
  <text x="288" y="114" text-anchor="middle" font-size="10" fill="#3b6fcc">3. Classify edges</text>
  <text x="288" y="128" text-anchor="middle" font-size="10" fill="#3b6fcc">4. Topological sort</text>

  <!-- Arrow 2 -->
  <line x1="368" y1="90" x2="398" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 3: CompiledGraph -->
  <rect x="406" y="44" width="160" height="92" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="486" y="68" text-anchor="middle" font-weight="bold" fill="#1d4ed8">CompiledGraph</text>
  <text x="486" y="86" text-anchor="middle" font-size="10" fill="#555">CompiledNode[]</text>
  <text x="486" y="100" text-anchor="middle" font-size="10" fill="#555">CompiledEdge[]</text>
  <text x="486" y="114" text-anchor="middle" font-size="10" fill="#555">frame_order[]</text>
  <text x="486" y="128" text-anchor="middle" font-size="10" fill="#555">audio_order[]</text>

  <!-- OperatorRegistry feed -->
  <rect x="208" y="160" width="160" height="44" rx="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="288" y="186" text-anchor="middle" font-weight="600" fill="#333">OperatorRegistry</text>
  <line x1="288" y1="160" x2="288" y2="136" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="152" font-size="9" fill="#666">descriptors</text>

  <!-- Cadence Determination Detail -->
  <rect x="20" y="230" width="220" height="130" rx="6" fill="#f0f4ff" stroke="#93a3c0" stroke-width="1"/>
  <text x="130" y="252" text-anchor="middle" font-weight="bold" font-size="12" fill="#1d4ed8">Cadence Determination</text>
  <text x="30" y="272" font-size="11" fill="#444">For each node:</text>
  <text x="40" y="290" font-size="10" fill="#555">if override == Audio &amp; capable → Audio</text>
  <text x="40" y="306" font-size="10" fill="#555">if override == Frame → Frame</text>
  <text x="40" y="322" font-size="10" fill="#555">if has_process_audio → Audio</text>
  <text x="40" y="338" font-size="10" fill="#555">else → Frame</text>

  <!-- Edge Classification Detail -->
  <rect x="260" y="230" width="220" height="130" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="370" y="252" text-anchor="middle" font-weight="bold" font-size="12" fill="#b45309">Edge Classification</text>
  <text x="270" y="274" font-size="11" fill="#444">Same cadence:</text>
  <text x="280" y="292" font-size="10" fill="#555">→ EdgeTransport::Direct</text>
  <text x="280" y="308" font-size="10" fill="#555">  (immediate copy in executor)</text>
  <text x="270" y="328" font-size="11" fill="#444">Cross cadence:</text>
  <text x="280" y="346" font-size="10" fill="#555">→ EdgeTransport::Snapshot</text>

  <!-- Topo Sort Detail -->
  <rect x="500" y="230" width="200" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="600" y="252" text-anchor="middle" font-weight="bold" font-size="12" fill="#15803d">Topological Sort</text>
  <text x="510" y="274" font-size="11" fill="#444">Kahn's algorithm per cadence:</text>
  <text x="520" y="294" font-size="10" fill="#555">frame_order: Frame + GPU</text>
  <text x="520" y="312" font-size="10" fill="#555">audio_order: Audio nodes</text>
  <text x="510" y="334" font-size="11" fill="#444">Edge indices partitioned:</text>
  <text x="520" y="352" font-size="10" fill="#555">frame_direct, audio_direct,</text>
  <text x="520" y="368" font-size="10" fill="#555">frame_to_audio, audio_to_frame</text>

  <!-- Connecting arrows to detail boxes -->
  <path d="M 288,136 L 288,210 L 130,210 L 130,230" fill="none" stroke="#93a3c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="288" y1="210" x2="370" y2="230" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <path d="M 486,136 L 486,210 L 600,210 L 600,230" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
