<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="m" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="mb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="mo" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">CadenceBridge: Double-Buffered Snapshots</text>

  <!-- Frame Thread Side -->
  <rect x="20" y="50" width="250" height="350" rx="8" fill="#f0f4ff" stroke="#93a3c0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="145" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Main Thread (Frame)</text>

  <!-- Audio Thread Side -->
  <rect x="450" y="50" width="250" height="350" rx="8" fill="#fff7ed" stroke="#c4956a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="575" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea580c">Audio Thread</text>

  <!-- Center: CadenceBridge -->
  <rect x="280" y="80" width="160" height="300" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#b45309">CadenceBridge</text>

  <!-- ParamSnapshot double buffer -->
  <text x="360" y="125" text-anchor="middle" font-weight="600" font-size="11" fill="#555">Frame → Audio</text>

  <rect x="296" y="132" width="56" height="70" rx="4" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="324" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">Buf [0]</text>
  <text x="324" y="162" text-anchor="middle" font-size="8" fill="#555">params</text>
  <text x="324" y="174" text-anchor="middle" font-size="8" fill="#555">floats</text>
  <text x="324" y="186" text-anchor="middle" font-size="8" fill="#555">lanes</text>
  <text x="324" y="198" text-anchor="middle" font-size="8" fill="#555">strings</text>

  <rect x="368" y="132" width="56" height="70" rx="4" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="396" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">Buf [1]</text>
  <text x="396" y="162" text-anchor="middle" font-size="8" fill="#555">params</text>
  <text x="396" y="174" text-anchor="middle" font-size="8" fill="#555">floats</text>
  <text x="396" y="186" text-anchor="middle" font-size="8" fill="#555">lanes</text>
  <text x="396" y="198" text-anchor="middle" font-size="8" fill="#555">strings</text>

  <!-- Atomic index -->
  <rect x="310" y="208" width="100" height="22" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">param_active_ : atomic</text>

  <!-- AnalysisSnapshot double buffer -->
  <text x="360" y="250" text-anchor="middle" font-weight="600" font-size="11" fill="#555">Audio → Frame</text>

  <rect x="296" y="258" width="56" height="70" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="324" y="274" text-anchor="middle" font-size="9" font-weight="600" fill="#ea580c">Buf [0]</text>
  <text x="324" y="288" text-anchor="middle" font-size="8" fill="#555">rms</text>
  <text x="324" y="300" text-anchor="middle" font-size="8" fill="#555">peak</text>
  <text x="324" y="312" text-anchor="middle" font-size="8" fill="#555">waveform</text>
  <text x="324" y="324" text-anchor="middle" font-size="8" fill="#555">errors</text>

  <rect x="368" y="258" width="56" height="70" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="396" y="274" text-anchor="middle" font-size="9" font-weight="600" fill="#ea580c">Buf [1]</text>
  <text x="396" y="288" text-anchor="middle" font-size="8" fill="#555">rms</text>
  <text x="396" y="300" text-anchor="middle" font-size="8" fill="#555">peak</text>
  <text x="396" y="312" text-anchor="middle" font-size="8" fill="#555">waveform</text>
  <text x="396" y="324" text-anchor="middle" font-size="8" fill="#555">errors</text>

  <!-- Atomic index -->
  <rect x="310" y="334" width="100" height="22" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="349" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">analysis_active_ : atomic</text>

  <!-- Frame thread operations -->
  <rect x="36" y="130" width="218" height="36" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="147" text-anchor="middle" font-weight="600" fill="#1d4ed8">push_to_audio()</text>
  <text x="145" y="161" text-anchor="middle" font-size="9" fill="#555">write inactive buf, swap index</text>

  <rect x="36" y="256" width="218" height="36" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="273" text-anchor="middle" font-weight="600" fill="#1d4ed8">pull_from_audio()</text>
  <text x="145" y="287" text-anchor="middle" font-size="9" fill="#555">read inactive analysis buf</text>

  <!-- Audio thread operations -->
  <rect x="466" y="130" width="218" height="36" rx="4" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="575" y="147" text-anchor="middle" font-weight="600" fill="#ea580c">active_params()</text>
  <text x="575" y="161" text-anchor="middle" font-size="9" fill="#555">atomic acquire-load index</text>

  <rect x="466" y="256" width="218" height="36" rx="4" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="575" y="273" text-anchor="middle" font-weight="600" fill="#ea580c">publish_analysis()</text>
  <text x="575" y="287" text-anchor="middle" font-size="9" fill="#555">write buf, atomic release-store</text>

  <!-- Arrows -->
  <line x1="254" y1="148" x2="296" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#mb)"/>
  <line x1="450" y1="160" x2="466" y2="148" stroke="#ea580c" stroke-width="1.5" marker-end="url(#mo)"/>
  <line x1="254" y1="274" x2="296" y2="290" stroke="#ea580c" stroke-width="1.5" marker-end="url(#mo)"/>
  <line x1="450" y1="290" x2="466" y2="274" stroke="#ea580c" stroke-width="1.5" marker-end="url(#mo)"/>

  <!-- Key property callout -->
  <rect x="20" y="370" width="680" height="24" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">Lock-free: no mutexes on audio thread. Writers fill inactive buffer, then atomically swap the active index.</text>
</svg>
