<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A22"/>
      <stop offset="100%" stop-color="#0B0F15"/>
    </linearGradient>
    <linearGradient id="vStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77F8DA"/>
      <stop offset="100%" stop-color="#46C8FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="56" y="56" width="912" height="912" rx="210" fill="url(#bg)"/>

  <!-- Main V shape -->
  <path d="M238 286 L512 738 L786 286"
        fill="none"
        stroke="url(#vStroke)"
        stroke-width="104"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Nodes along the V path -->
  <g fill="#D6FFF5" stroke="#0F131A" stroke-width="10">
    <circle cx="238" cy="286" r="34"/>
    <circle cx="347" cy="466" r="26"/>
    <circle cx="512" cy="738" r="36"/>
    <circle cx="677" cy="466" r="26"/>
    <circle cx="786" cy="286" r="34"/>
  </g>
</svg>
