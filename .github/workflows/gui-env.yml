name: GUI Env Tests

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  gui-env:
    runs-on: [self-hosted, macOS]
    env:
      VIVID_GUI_ENV_HOME: ${{ github.workspace }}/build/.test_ui_screenshot_smoke/gui_env/home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout vivid-wavetable
        uses: actions/checkout@v4
        with:
          repository: seethroughlab/vivid-wavetable
          path: vivid-wavetable

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Create app bundle skeleton
        run: mkdir -p build/vivid.app/Contents/PlugIns

      - name: Build GUI env smoke tests
        run: cmake --build build --target test_ui_screenshot_smoke -j$(sysctl -n hw.logicalcpu)

      - name: Link wavetable package
        env:
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
        run: ./build/vivid link ./vivid-wavetable

      - name: Rebuild wavetable package
        env:
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
        run: ./build/vivid rebuild vivid-wavetable

      - name: Verify wavetable package setup
        env:
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
        run: ./build/vivid list-packages | grep '^vivid-wavetable '

      - name: Run GUI env smoke tests
        env:
          VIVID_ENABLE_UI_SCREENSHOT_SMOKE: "1"
          VIVID_ENABLE_GUI_ENV_SMOKE: "1"
          VIVID_UI_SMOKE_LANE: "gui_env"
          VIVID_GUI_ENV_PACKAGE_ROOT: "${{ github.workspace }}/vivid-wavetable"
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
        run: cd build && ctest -L '^GUI_ENV$' --output-on-failure

      - name: Upload GUI env artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-env-artifacts
          path: build/.test_ui_screenshot_smoke/gui_env
          if-no-files-found: ignore
          retention-days: 14
