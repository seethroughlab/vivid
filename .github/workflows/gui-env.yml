name: GUI Env Tests

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  gui-env:
    runs-on: [self-hosted, macOS]
    env:
      VIVID_GUI_ENV_HOME: ${{ github.workspace }}/build/.test_ui_screenshot_smoke/gui_env/home
      VIVID_GUI_ENV_PACKAGE_ROOT: ${{ github.workspace }}/external-packages
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout vivid-wavetable
        uses: actions/checkout@v4
        with:
          repository: seethroughlab/vivid-wavetable
          path: external-packages/vivid-wavetable

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Create app bundle skeleton
        run: mkdir -p build/vivid.app/Contents/PlugIns

      - name: Build vivid binary (needed for package verify step)
        run: cmake --build build --target vivid -j$(sysctl -n hw.logicalcpu)

      - name: Configure vivid-wavetable package
        run: >
          cmake
          -S external-packages/vivid-wavetable
          -B external-packages/vivid-wavetable/build
          -DVIVID_SRC_DIR=${{ github.workspace }}
          -DVIVID_PLUGIN_SUFFIX=.dylib
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build vivid-wavetable package
        run: >
          cmake --build external-packages/vivid-wavetable/build
          --target operators
          -j$(sysctl -n hw.logicalcpu)

      - name: Verify wavetable package setup
        env:
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
          VIVID_PACKAGE_PATHS: ${{ env.VIVID_GUI_ENV_PACKAGE_ROOT }}
        run: ./build/vivid list-packages | grep '^vivid-wavetable '

      - name: Run production gate (env profile)
        env:
          VIVID_ENABLE_UI_SCREENSHOT_SMOKE: "1"
          VIVID_ENABLE_GUI_ENV_SMOKE: "1"
          VIVID_UI_SMOKE_LANE: "gui_env"
          VIVID_GUI_ENV_PACKAGE_ROOT: "${{ env.VIVID_GUI_ENV_PACKAGE_ROOT }}/vivid-wavetable"
          VIVID_PACKAGE_PATHS: ${{ env.VIVID_GUI_ENV_PACKAGE_ROOT }}
          HOME: ${{ env.VIVID_GUI_ENV_HOME }}
        run: cmake --build build --target production_gate_env -j$(sysctl -n hw.logicalcpu)

      - name: Upload production gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-reports-env-${{ github.sha }}
          path: |
            build/reports/ctest-*.xml
            build/reports/production-gate.json
            build/reports/health/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GUI env artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-env-artifacts
          path: |
            build/.test_ui_screenshot_smoke/gui_env/artifacts
            build/.test_ui_screenshot_smoke/gui_smoke/artifacts
          if-no-files-found: ignore
          retention-days: 14
