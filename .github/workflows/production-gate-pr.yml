# Production-gate PR check (P4.5) — UNVERIFIED here: needs a self-hosted macOS runner
# (the headless gate could run on ubuntu, but this mirrors classic's macOS PR gate so the
# gui/env tiers can light up on the same runner later). Builds the tests-only configure,
# runs the core gate, and upserts a single status comment on the PR.
name: production-gate-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: gate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, macOS]   # requires a registered self-hosted runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Configure (tests only) + build
        run: |
          cmake -S app -B app/build -DVIVID_BUILD_APP=OFF -DVIVID_BUILD_TESTS=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build app/build -j
      - name: Run production gate (core)
        id: gate
        run: VIVID_BUILD_DIR=app/build scripts/run_production_gate.sh core
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate
          path: app/build/reports/
          retention-days: 14
      - name: Upsert PR comment
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY="$(uv run tools/format_pr_comment.py app/build/reports/production-gate.json || echo 'gate report missing')"
          # Find an existing marked comment and edit it, else create one.
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq '[.[] | select(.body | startswith("<!-- production-gate -->"))][0].id')"
          if [[ -n "$ID" && "$ID" != "null" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -f body="$BODY"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY"
          fi

  # The session audio EXECUTOR test (test_session_executor). The engine reaches CoreFoundation, so it
  # is macOS-only and needs the full-app configure (VIVID_BUILD_APP=ON) for its VST3/CLAP/signalsmith
  # deps — hence it can't ride the portable ubuntu headless-tests job. We build ONLY the test target,
  # so wgpu/glfw and the GUI app are never compiled (the app-ON configure just makes the deps available;
  # they are cached on the self-hosted runner, which already does app-ON release builds).
  audio-engine-tests:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (full-app, for the audio deps) + build the audio-engine test tier
        run: |
          cmake -S app -B app/build-audio -DVIVID_BUILD_APP=ON -DVIVID_BUILD_TESTS=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          # The non-TSan AUDIO_ENGINE tests. test_clap_plugin_roundtrip pulls in the in-tree CLAP
          # fixture (vivid_test_clap) via add_dependencies, so it is built too. test_session_concurrency
          # is TSan-only and runs in the audio-thread-sanitizer job below.
          cmake --build app/build-audio -j --target \
            test_session_executor test_audio_bounce test_audio_health test_plugin_param_base test_bridge_undo_stability \
            test_clap_plugin_roundtrip test_clap_modulation test_missing_instrument_cue \
            test_node_bypass test_node_solo test_plugin_watchdog test_plugin_hang_monitor
      - name: Run the audio-engine tests (native ops + real in-tree CLAP plugin)
        # --no-tests=error (Ph6 P2-01): a label that matches nothing is a FAILURE, not a silent pass.
        run: ctest --test-dir app/build-audio -L AUDIO_ENGINE -E test_session_concurrency --no-tests=error --output-on-failure

  # ADR-0029 phase 2: the audio↔UI concurrency harness under ThreadSanitizer. Races a render thread
  # (session_process) against a UI/mutator thread over the real gen-counter/try_lock/SPSC/atomic-ring
  # machinery — the races test_session_executor (single-threaded) can't reach. macOS-only + app-ON for the
  # audio deps, so it runs on the self-hosted runner; we build ONLY the harness target (TSan-instrumented).
  # No third-party suppression list: session_process starts no device/GPU/CLAP thread — only the harness's
  # own two threads race.
  audio-thread-sanitizer:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (full-app, TSan) + build only the concurrency harness
        run: |
          cmake -S app -B app/build-tsan-audio -DVIVID_BUILD_APP=ON -DVIVID_BUILD_TESTS=ON \
                -DVIVID_SANITIZE_THREAD=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build app/build-tsan-audio --target test_session_concurrency -j
      - name: Run the audio↔UI harness under ThreadSanitizer
        # --no-tests=error (Ph6 P2-01): the AUDIO_THREAD label must match at least one test.
        run: ctest --test-dir app/build-tsan-audio -L AUDIO_THREAD --no-tests=error --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
