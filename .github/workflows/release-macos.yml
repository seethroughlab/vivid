# macOS release (P4.5). On a vX.Y.Z tag, on the self-hosted macOS runner: build the app, run
# the production gate + the sanitizer/audio release-verification legs, then sign + notarize +
# DMG it and generate the Sparkle appcast. Per ADR-0040 this has been exercised end-to-end
# (produces a signed + notarized DMG). Requires Apple Developer ID secrets; notarization is
# REQUIRED on a tag build (sign_and_notarize.sh fails loudly without it). The Sparkle
# auto-updater is still a stub (deferred) — see docs/release/README.md.
name: release-macos

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "ref to build (pre-release validation)"
        required: false

permissions:
  contents: write   # create the GitHub release + upload the DMG

jobs:
  release:
    runs-on: [self-hosted, macOS]
    env:
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      # Ph6 P1-02: on a real tag build (which PUBLISHES), require notarization — sign_and_notarize.sh
      # then fails loud on missing credentials instead of silently shipping an un-notarized DMG.
      # Empty on workflow_dispatch validation runs (they don't publish), so the signing path can still
      # be exercised without an app-specific password.
      REQUIRE_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
      # Notarization: either a notarytool keychain profile (NOTARY_PROFILE) on the runner,
      # or the explicit-credential fallback below.
      NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v5

      - name: Version guard (tag must match CMake version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run tools/check_version.py --expect "${GITHUB_REF_NAME}"

      - name: Build (release)
        run: |
          # Self-hosted runners reuse the workspace, so a stale build dir can carry the wrong-arch wgpu
          # (the runner reports host x86_64 under Rosetta) or a stale cache. Start clean for a
          # deterministic, correctly-arch'd release build.
          rm -rf app/build
          cmake -S app -B app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build app/build -j 10

      - name: Production gate (core) must pass before shipping
        run: VIVID_BUILD_DIR=app/build scripts/run_production_gate.sh core

      # Ph6 P1-01: the gate core (HEADLESS_SMOKE) does not exercise the realtime-safety paths. Re-run
      # the sanitizer + audio-engine legs on THIS commit before signing, so a directly-pushed tag (or a
      # squash-merge SHA that no longer carries the PR checks) can never ship unverified for the RT paths.
      - name: Release verification (sanitizers + audio engine)
        run: scripts/run_release_verification.sh

      # Audit Ph4 P1-03: a golden save/load round-trip through the just-built app — build a project,
      # snapshot get_session (session_to_json), save_project → load_project (session_from_json), snapshot
      # again, assert the document is identical. Skips cleanly if this runner can't launch the GUI app
      # (no window server / GPU); fails on a real round-trip diff or an app crash.
      - name: Persistence round-trip (save/load is lossless)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_persist_roundtrip.py

      # ADR-0033 P2: duplicate_nodes preserves params/edges (internal kept, external dropped) + mappings.
      - name: Duplicate nodes (copy/paste contract)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_duplicate_nodes.py

      # ADR-0033 P2b: audio duplicate_audio_nodes preserves params/edges (internal kept, external dropped).
      - name: Duplicate audio nodes (copy/paste contract)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_duplicate_audio_nodes.py

      # Session clip-stop: launch a clip, stop_track -> idle, relaunch, then stop_all across two tracks.
      - name: Stop track (clip-stop contract)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_stop_track.py

      # ADR-0053 Phase B: control-edge integration — a ReactiveMaster added live to a 30-node graph
      # doesn't crash, and deleting a track removes its ReactiveTrack node + cascades its control edges.
      - name: Reactive control edges (large-graph add + track-drop)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_reactive_edges.py

      # API-cleanup Phase-7 follow-up b: optimistic-concurrency guard on clip edits — get_clip reports a
      # per-clip rev; set_clip with a stale expected_rev is rejected ('conflict') instead of clobbering.
      - name: Clip edit conflict (optimistic concurrency)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_clip_conflict.py

      # ADR-0049: the Sampler sample-editing surface an agent drives — trim / slice / detect / tune /
      # slices-to-MIDI, their guard rails, and that every one of them (incl. the load) is undoable.
      - name: Sampler editing surface (MCP parity)
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_sampler_surface.py

      # SMF import/export — the only path from a drum plugin's groove browser into Vivid. Also pins
      # the fixed-buffer truncation regression: a >256-note import must survive save + reload.
      - name: MIDI file import/export
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_midi_import.py

      # P4: clip-level controller automation — lanes must survive note edits, RMW transforms, save,
      # the clip pool, and undo. The separation from set_clip is the whole point.
      - name: Clip controller automation
        run: VIVID_APP="$PWD/app/build/vivid.app/Contents/MacOS/vivid" uv run mcp/tests/test_clip_cc.py

      # Import the Developer ID cert into a dedicated temporary keychain so codesign can reach the
      # private key non-interactively (a locked/service-context login keychain gives
      # errSecInternalComponent on a self-hosted runner). Cleaned up below regardless of outcome.
      - name: Import Developer ID signing certificate
        env:
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/vivid-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          # Remember the original search list so the cleanup step can restore it (self-hosted hygiene).
          security list-keychains -d user | sed 's/[[:space:]"]//g' > "$RUNNER_TEMP/orig-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_B64" | base64 --decode > "$P12"
          security import "$P12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put our keychain first on the search list so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/orig-keychains.txt")
          rm -f "$P12"
          security find-identity -p codesigning -v "$KEYCHAIN" | head -3

      - name: Sign + notarize + DMG
        run: scripts/release/sign_and_notarize.sh app/build/vivid.app/Contents/MacOS/../.. build/dist

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DMG="build/dist/vivid.dmg"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$DMG")"
          uv run scripts/release/generate_appcast.py \
            --version "$VER" --url "$URL" --length "$(stat -f%z "$DMG")" \
            --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --output build/dist/appcast.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vivid-macos-release
          path: build/dist/
          retention-days: 30

      # On a real vX.Y.Z tag, publish the signed+notarized DMG (and the Sparkle appcast) to a GitHub
      # Release. Skipped for workflow_dispatch pre-release validation runs. contents:write is granted above.
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/vivid.dmg
            build/dist/appcast.xml
          generate_release_notes: true

      # Remove the temporary signing keychain + restore the runner's original search list (self-hosted).
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/vivid-signing.keychain-db" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/orig-keychains.txt" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/orig-keychains.txt") || true
          fi
