name: Version Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Version Surfaces
        shell: bash
        run: |
          set -euo pipefail
          cmake_ver=$(grep -E '^project\(vivid VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ -z "${cmake_ver}" ]]; then
            echo "Failed to parse CMake project version" >&2
            exit 1
          fi

          runtime_fallback=$(grep -E '^#define VIVID_CORE_VERSION "' src/runtime/main.cpp | head -n1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          ui_fallback=$(grep -E '^#define VIVID_CORE_VERSION "' src/ui/node_graph_draw.cpp | head -n1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')

          for v in "$runtime_fallback" "$ui_fallback"; do
            if [[ -z "${v}" ]]; then
              echo "Failed to parse one or more VIVID_CORE_VERSION fallback macros" >&2
              exit 1
            fi
          done

          if [[ "$cmake_ver" != "$runtime_fallback" || "$cmake_ver" != "$ui_fallback" ]]; then
            echo "Version mismatch:" >&2
            echo "  CMake:   $cmake_ver" >&2
            echo "  runtime: $runtime_fallback" >&2
            echo "  ui:      $ui_fallback" >&2
            exit 1
          fi

          echo "Version surfaces aligned at $cmake_ver"
