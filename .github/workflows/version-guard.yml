# Version guard (P4.5). Vivid has a single version source — project(vivid VERSION …)
# in app/CMakeLists.txt — so this just asserts it parses as semver (and, on a release tag,
# that it matches the tag). Cheap, ubuntu, no signing. VERIFIABLE: tools/check_version.py
# is unit-runnable locally.
name: version-guard

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate version (and match the tag on a release)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            uv run tools/check_version.py --expect "${GITHUB_REF_NAME}"
          else
            uv run tools/check_version.py
          fi
      - name: MCP <-> control-server parity (static)
        run: uv run mcp/tests/test_mcp_parity.py
      - name: Operator-ABI docs match types.h (static)
        run: uv run tools/check_abi_docs.py
      - name: MCP <-> control-server argument-shape parity (static)
        run: uv run mcp/tests/test_mcp_arg_parity.py
      - name: Vendored example/package snapshots are consistent (static)
        run: uv run tools/check_vendored_snapshots.py
