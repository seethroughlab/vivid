name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  build-linux:
    name: Build (Linux)
    # Use self-hosted for pushes and PRs from the same repo (trusted)
    # Use GitHub-hosted for PRs from forks (untrusted)
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            xvfb \
            mesa-utils \
            lcov

      - name: Download wgpu-native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WGPU_VERSION="v24.0.0.2"
          mkdir -p build/_deps/wgpu
          curl -fL --retry 3 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o "build/_deps/wgpu/wgpu.zip" \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-linux-x86_64-release.zip"

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON -DCOVERAGE=ON

      - name: Build
        run: |
          # Limit parallelism on self-hosted to avoid OOM (C++ compilation is memory-intensive)
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            cmake --build build --config Release --parallel 2
          else
            cmake --build build --config Release --parallel
          fi

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure -C Release -L "unit|integration|build"

      - name: Run MCP server tests
        run: ctest --test-dir build --output-on-failure -C Release -L "mcp"
        timeout-minutes: 5

      # GPU-based tests run with Mesa llvmpipe software renderer
      # continue-on-error: wgpu-native surface creation doesn't work reliably with Mesa/xvfb
      - name: Run smoke tests (headless)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ctest --test-dir build --output-on-failure -C Release -L "smoke" || true
        timeout-minutes: 10
        continue-on-error: true

      - name: Run visual regression tests (headless)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ctest --test-dir build --output-on-failure -C Release -L "visual" || true
        timeout-minutes: 15
        continue-on-error: true

      - name: Generate coverage report
        continue-on-error: true
        run: |
          lcov --capture --directory build --output-file coverage.info || exit 0
          lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' --output-file coverage.info || true
          lcov --list coverage.info || true

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: coverage.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-linux
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/
            /tmp/vivid_*.png
          if-no-files-found: ignore

  build-macos:
    name: Build (macOS)
    # Use self-hosted for pushes and PRs from the same repo (trusted)
    # Use GitHub-hosted for PRs from forks (untrusted)
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Download wgpu-native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WGPU_VERSION="v24.0.0.2"
          ARCH=$(uname -m)
          if [[ "$ARCH" == "arm64" ]]; then
            WGPU_FILE="wgpu-macos-aarch64-release.zip"
          else
            WGPU_FILE="wgpu-macos-x86_64-release.zip"
          fi
          mkdir -p build/_deps/wgpu
          curl -fL --retry 3 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o "build/_deps/wgpu/wgpu.zip" \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/${WGPU_FILE}"
          ls -la build/_deps/wgpu/
        shell: bash

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON

      - name: Build
        run: |
          # Limit parallelism on self-hosted to avoid OOM (C++ compilation is memory-intensive)
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            cmake --build build --config Release --parallel 4
          else
            cmake --build build --config Release --parallel
          fi

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure -C Release -L "unit|integration|build"

      - name: Run MCP server tests
        run: ctest --test-dir build --output-on-failure -C Release -L "mcp"
        timeout-minutes: 5

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-macos
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/
          if-no-files-found: ignore

  build-windows:
    name: Build (Windows)
    # Use self-hosted for pushes and PRs from the same repo (trusted)
    # Use GitHub-hosted for PRs from forks (untrusted)
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Windows"]') || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Download wgpu-native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $WGPU_VERSION = "v24.0.0.2"
          New-Item -ItemType Directory -Force -Path build/_deps/wgpu | Out-Null
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
          Invoke-WebRequest -Uri "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/wgpu-windows-x86_64-msvc-release.zip" -Headers $headers -OutFile "build/_deps/wgpu/wgpu.zip"
        shell: powershell

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON

      - name: Build
        run: |
          # Limit parallelism on self-hosted to avoid OOM (C++ compilation is memory-intensive)
          if ("${{ runner.environment }}" -eq "self-hosted") {
            cmake --build build --config Release --parallel 4
          } else {
            cmake --build build --config Release --parallel
          }
        shell: powershell

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure -C Release -L "unit|integration|build"

      - name: Run MCP server tests
        run: ctest --test-dir build --output-on-failure -C Release -L "mcp"
        timeout-minutes: 5

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/
          if-no-files-found: ignore

  build-raspberry-pi:
    name: Build (Raspberry Pi ARM64)
    # Use self-hosted Pi for pushes and PRs from the same repo (trusted)
    # Use GitHub-hosted with cross-compilation for PRs from forks (untrusted)
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "Linux", "ARM64"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      # Cross-compilation setup (only for GitHub-hosted runners / fork PRs)
      - name: Install cross-compilation toolchain
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            pkg-config

      - name: Install ARM64 libraries (cross-compile)
        if: runner.environment == 'github-hosted'
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list
          fi
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev:arm64 libxrandr-dev:arm64 libxinerama-dev:arm64 \
            libxcursor-dev:arm64 libxi-dev:arm64 libxext-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 libgl1-mesa-dev:arm64

      - name: Create CMake toolchain file (cross-compile)
        if: runner.environment == 'github-hosted'
        run: |
          cat > arm64-toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu /usr)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_LIBRARY_PATH /usr/lib/aarch64-linux-gnu)
          list(APPEND CMAKE_PREFIX_PATH /usr/lib/aarch64-linux-gnu)
          set(PKG_CONFIG_EXECUTABLE /usr/bin/pkg-config)
          set(ENV{PKG_CONFIG_PATH} "/usr/lib/aarch64-linux-gnu/pkgconfig")
          set(ENV{PKG_CONFIG_LIBDIR} "/usr/lib/aarch64-linux-gnu/pkgconfig")
          EOF

      - name: Configure CMake (cross-compile)
        if: runner.environment == 'github-hosted'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=arm64-toolchain.cmake -DBUILD_TESTS=OFF

      # Native build setup (for self-hosted Pi runner)
      - name: Clean up stale apt sources
        if: runner.environment == 'self-hosted'
        run: |
          # Remove any leftover cross-compilation apt sources from previous runs
          sudo rm -f /etc/apt/sources.list.d/arm64.list

      - name: Install dependencies (native)
        if: runner.environment == 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Download wgpu-native
        if: runner.environment == 'self-hosted'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WGPU_VERSION="v24.0.0.2"
          mkdir -p build/_deps/wgpu
          curl -fL --retry 3 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o "build/_deps/wgpu/wgpu.zip" \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-linux-aarch64-release.zip"

      - name: Configure CMake (native)
        if: runner.environment == 'self-hosted'
        run: cmake -B build -DBUILD_TESTS=ON

      # Shared build step
      - name: Build
        run: |
          # Limit parallelism on Pi to avoid OOM (self-hosted ARM64 has limited RAM)
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            cmake --build build --config Release --parallel 2
          else
            cmake --build build --config Release --parallel
          fi

      # Tests (only on native self-hosted runner)
      - name: Run unit and integration tests
        if: runner.environment == 'self-hosted'
        run: ctest --test-dir build --output-on-failure -C Release -L "unit|integration|build"

      - name: Run MCP server tests
        if: runner.environment == 'self-hosted'
        run: ctest --test-dir build --output-on-failure -C Release -L "mcp"
        timeout-minutes: 5

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-raspberry-pi
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
