name: Smoke Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macOS]
    env:
      VIVID_GUI_SMOKE_HOME: ${{ github.workspace }}/build/.test_ui_screenshot_smoke/gui_smoke/home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Create app bundle skeleton
        run: mkdir -p build/vivid.app/Contents/PlugIns

      - name: Build smoke tests
        run: cmake --build build --target test_demo_graphs test_ui_overlay_interactions test_ui_editor_interactions test_ui_widget_interactions test_ui_screenshot_smoke -j$(sysctl -n hw.logicalcpu)

      - name: Validate semantic tags
        run: ./scripts/validate_semantic_tags.sh

      - name: Run headless smoke tests
        run: cd build && ctest -L '^HEADLESS_SMOKE$' --output-on-failure

      - name: Run deterministic UI smoke tests
        run: cd build && ctest -L '^UI_SMOKE$' --output-on-failure

      - name: Run GUI smoke tests
        env:
          VIVID_ENABLE_UI_SCREENSHOT_SMOKE: "1"
          VIVID_UI_SMOKE_LANE: "gui_smoke"
          HOME: ${{ env.VIVID_GUI_SMOKE_HOME }}
        run: cd build && ctest -L '^GUI_SMOKE$' --output-on-failure

      - name: Upload GUI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-artifacts
          path: build/.test_ui_screenshot_smoke/gui_smoke
          if-no-files-found: ignore
          retention-days: 14
