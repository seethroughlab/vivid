name: Smoke Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macOS]
    env:
      VIVID_GUI_SMOKE_HOME: ${{ github.workspace }}/build/.test_ui_screenshot_smoke/gui_smoke/home
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Create app bundle skeleton
        run: mkdir -p build/vivid.app/Contents/PlugIns

      - name: Run production gate (gui profile)
        env:
          VIVID_ENABLE_UI_SCREENSHOT_SMOKE: "1"
          VIVID_UI_SMOKE_LANE: "gui_smoke"
          HOME: ${{ env.VIVID_GUI_SMOKE_HOME }}
        run: cmake --build build --target production_gate_gui -j$(sysctl -n hw.logicalcpu)

      - name: Upload production gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-reports-smoke-${{ github.sha }}
          path: |
            build/reports/ctest-*.xml
            build/reports/production-gate.json
            build/reports/health/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GUI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-artifacts
          path: build/.test_ui_screenshot_smoke/gui_smoke/artifacts
          if-no-files-found: ignore
          retention-days: 14
